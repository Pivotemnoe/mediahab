name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: media_hub_ci
          POSTGRES_PASSWORD: media_hub_ci
          POSTGRES_USER: media_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U media_hub_ci -d media_hub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-phase00.txt
            services/api/requirements.txt
            services/worker/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          pnpm install --frozen-lockfile

      - name: Python compile and secret signatures
        run: |
          python -m compileall -q tools tests services packages connectors
          python tools/check_no_plaintext_secrets.py

      - name: Web checks
        run: |
          pnpm --filter @temichev/web lint
          pnpm --filter @temichev/web typecheck
          pnpm --filter @temichev/web build
          pnpm audit --prod --audit-level high

      - name: Contract and unit tests
        run: |
          make test-ui-contracts PYTHON=python PY=python
          python -m unittest discover -s tests
          python -m unittest discover -s services/api/tests

      - name: Migration on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://media_hub_ci:media_hub_ci@localhost:5432/media_hub_ci
        working-directory: services/api
        run: python -m alembic -c alembic.ini upgrade head

      - name: OpenAPI is current
        run: |
          python tools/export_openapi.py
          git diff --exit-code -- packages/contracts/openapi/openapi.json apps/web/src/generated-api/openapi.json
